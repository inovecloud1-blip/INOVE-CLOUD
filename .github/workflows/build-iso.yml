name: Build InoveCloud OS 2026 - Debian 13 GNOME Glass ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versão para o Release (ex: v2026.1-glass)'
        required: false
        default: 'v2026.1-glass'

permissions:
  contents: write

jobs:
  build-iso:
    name: Compilar Debian 13 (Trixie) GNOME Glass Live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências e Compilar Web Suite
        run: |
          npm ci || npm install
          npm run build

      - name: 🛠️ Instalar Ferramentas de Criação de ISO (Debian / GRUB / EFI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            curl \
            rsync

      - name: 🚀 Executar Script de Compilação da ISO Debian 13 GNOME Glass
        run: |
          chmod +x iso-builder/build-iso.sh
          sudo ./iso-builder/build-iso.sh

      - name: 🔒 Verificar Integridade e Checksum SHA256
        run: |
          ls -lh dist-iso/
          cat dist-iso/*.sha256

      - name: 📤 Fazer Upload do Artefato da ISO (.iso & .sha256)
        uses: actions/upload-artifact@v4
        with:
          name: inovecloud-os-debian13-gnome-amd64
          path: |
            dist-iso/*.iso
            dist-iso/*.sha256
          retention-days: 30

      - name: 🏷️ Publicar Release Automático no GitHub
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "InoveCloud OS 2026 - Debian 13 GNOME Glass Edition"
          body: |
            ## 💿 InoveCloud OS - Debian 13 (Trixie) GNOME Liquid Glass Live ISO
            
            Sistema Operacional completo baseado em **Debian 13 (Trixie)** com interface desktop **GNOME 46+ Liquid Glass Theme**, wallpapers 8K/4K nativos, suporte a Flathub/APT e Web Desktop integrado.
            
            ### ✨ Destaques:
            - **Base**: Debian GNU/Linux 13 (Trixie Minimal x86_64)
            - **Ambiente Gráfico**: GNOME Shell 46+ com Tema Liquid Glass e Transparências
            - **Dock**: Floating Glass Dock estilo InoveCloud / macOS
            - **Wallpapers**: Coleção Completa 8K HDR InoveCloud integrada ao seletor do GNOME
            - **Drivers**: Mesa 24+ com aceleração de GPU (Intel Iris/Xe, AMD Radeon, Nvidia)
            - **Boot**: Compatível com UEFI (Secure Boot) e BIOS Legacy
            
            ### 📥 Arquivos:
            - `inovecloud-os-debian13-gnome-amd64.iso`
            - `inovecloud-os-debian13-gnome-amd64.iso.sha256`
          files: |
            dist-iso/*.iso
            dist-iso/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
