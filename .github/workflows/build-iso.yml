name: Build InoveCloud OS - Desktop & Pure Kernel ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      edition:
        description: 'Selecione a Edição para Compilar'
        required: true
        default: 'desktop'
        type: choice
        options:
          - 'desktop'
          - 'pure-kernel'
      release_tag:
        description: 'Tag de versão para o Release (ex: v2026.1-desktop)'
        required: false
        default: 'v2026.1-desktop'

permissions:
  contents: write

jobs:
  build-iso:
    name: Compilar InoveCloud OS (${{ github.event.inputs.edition || 'desktop' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🚀 Executar Compilação da ISO Desktop Completa GNOME Liquid Glass (~2GB)
        if: ${{ github.event.inputs.edition == 'desktop' || github.event.inputs.edition == '' || github.event_name == 'push' }}
        run: |
          chmod +x iso-builder/build-iso.sh icpkg.py inovecloud-install.sh
          sudo ./iso-builder/build-iso.sh

      - name: ⚡ Executar Compilação do Sistema Puro Micro-Kernel (~80MB)
        if: ${{ github.event.inputs.edition == 'pure-kernel' }}
        run: |
          chmod +x build-inovecloud.sh icpkg.py inovecloud-install.sh
          sudo ./build-inovecloud.sh

      - name: 🔒 Verificar Integridade da ISO e Checksum SHA256
        run: |
          ls -lh dist-iso/
          cat dist-iso/*.sha256

      - name: 📤 Fazer Upload do Artefato da ISO (.iso & .sha256)
        uses: actions/upload-artifact@v4
        with:
          name: inovecloud-os-${{ github.event.inputs.edition || 'desktop' }}-amd64
          path: |
            dist-iso/*.iso
            dist-iso/*.sha256
          retention-days: 30
          compression-level: 0

      - name: 🏷️ Publicar Release de Alta Velocidade no GitHub (CDN Global)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'latest' }}
          name: "InoveCloud OS 2026 - Desktop Edition (Download Oficial)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 InoveCloud OS 2026 - Imagem ISO Oficial (Download de Alta Velocidade)
            
            Distribuição Linux Desktop completa desenvolvida para computadores reais (Intel/AMD/NVIDIA) e máquinas virtuais (VirtualBox, VMware, QEMU).
            
            ### ⚡ Links Diretos de Download (CDN Global):
            - Baixe a imagem `.iso` abaixo com suporte a aceleradores de download, retomada de conexão e velocidade máxima.
            
            ### 🛠️ Recursos Incluídos:
            - **Desktop Environment**: GNOME 46+ com tema Liquid Glass, Blur e animações fluidas
            - **Kernel Linux Oficial**: 6.x LTS com suporte a UEFI & BIOS Legacy
            - **App Store & Flathub**: Firefox, Spotify, VLC, VS Code e gerenciador nativo `icpkg`
            - **Drivers & Hardware**: Suporte out-of-the-box para NVIDIA, AMD, Intel HD, Realtek e Broadcom Wi-Fi
            - **Áudio & Impressão**: Pipewire/PulseAudio de baixa latência e servidor CUPS integrado
            - **Nuvem & Persistência**: Suporte a Live USB com persistência e sincronização de nuvem `/home/inove/CloudStorage`
          files: |
            dist-iso/*.iso
            dist-iso/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
