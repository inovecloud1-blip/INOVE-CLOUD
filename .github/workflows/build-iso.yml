name: Build InoveCloud OS - Pure Kernel from Scratch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versão para o Release (ex: v2026.1-pure)'
        required: false
        default: 'v2026.1-pure'

permissions:
  contents: write

jobs:
  build-pure-iso:
    name: Compilar InoveCloud OS Puro (Kernel Oficial + BusyBox)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 💾 Restaurar cache das fontes
        uses: actions/cache@v4
        with:
          path: inovecloud-pure-build/src
          key: sources-${{ runner.os }}-${{ hashFiles('build-inovecloud.sh') }}
          restore-keys: |
            sources-${{ runner.os }}-

      - name: 🚀 Executar Compilação do Sistema Puro (Kernel Oficial + BusyBox)
        run: |
          chmod +x build-inovecloud.sh icpkg.py inovecloud-install.sh
          sudo ./build-inovecloud.sh

      - name: 🔒 Verificar Integridade da ISO e Checksum SHA256
        run: |
          ls -lh dist-iso/
          cat dist-iso/*.sha256

      - name: 📤 Fazer Upload do Artefato da ISO (.iso & .sha256)
        uses: actions/upload-artifact@v4
        with:
          name: inovecloud-os-pure-kernel-amd64
          path: |
            dist-iso/*.iso
            dist-iso/*.sha256
          retention-days: 30
          compression-level: 0

      - name: 🏷️ Publicar Release de Alta Velocidade no GitHub (CDN Global)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'latest' }}
          name: "InoveCloud OS 2026 - Pure Kernel Edition (Download Rápido)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 InoveCloud OS 2026 - Imagem ISO Oficial (Download de Alta Velocidade)
            
            Distribuição Linux desenvolvida do zero, otimizada para computadores reais e máquinas virtuais (VirtualBox, VMware, QEMU).
            
            ### ⚡ Links Diretos de Download (CDN Global):
            - Baixe a imagem `.iso` abaixo com suporte a aceleradores de download, retomada de conexão e velocidade máxima.
            
            ### 🛠️ Características do Sistema:
            - **Kernel Oficial**: Linux 6.6 LTS com suporte a UEFI & BIOS Legacy
            - **Drivers de Vídeo & Gráficos**: Suporte a aceleração 3D, DRM e Framebuffer
            - **Rede & Wi-Fi**: Conexão automática DHCP, Intel iwlwifi, Realtek e Atheros
            - **Terminal & Shell**: Shell Unix completo integrado
            - **Modo Seguro**: Fallback para compatibilidade total em hardware fraco
          files: |
            dist-iso/*.iso
            dist-iso/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
