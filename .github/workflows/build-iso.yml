name: Build InoveCloud OS - Pure Kernel from Scratch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versão para o Release (ex: v2026.1-pure)'
        required: false
        default: 'v2026.1-pure'

permissions:
  contents: write

jobs:
  build-pure-iso:
    name: Compilar InoveCloud OS Puro (Kernel Oficial + BusyBox)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 💾 Restaurar cache das fontes
        uses: actions/cache@v4
        with:
          path: inovecloud-pure-build/src
          key: sources-${{ runner.os }}-${{ hashFiles('build-inovecloud.sh') }}
          restore-keys: |
            sources-${{ runner.os }}-

      - name: 🚀 Executar Compilação do Sistema Puro (Kernel Oficial + BusyBox)
        run: |
          chmod +x build-inovecloud.sh icpkg.py inovecloud-install.sh
          sudo ./build-inovecloud.sh

      - name: 🔒 Verificar Integridade da ISO e Checksum SHA256
        run: |
          ls -lh dist-iso/
          cat dist-iso/*.sha256

      - name: 📤 Fazer Upload do Artefato da ISO (.iso & .sha256)
        uses: actions/upload-artifact@v4
        with:
          name: inovecloud-os-pure-kernel-amd64
          path: |
            dist-iso/*.iso
            dist-iso/*.sha256
          retention-days: 30
          compression-level: 0

      - name: 🏷️ Publicar Release Automático no GitHub
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "InoveCloud OS 2026 - Pure Kernel Edition (Zero Base)"
          body: |
            ## 🚀 InoveCloud OS 2026 - Distribuição Linux Pura e Independente
            
            Sistema Operacional Linux criado **do zero**, sem depender de Debian, Ubuntu ou Arch:
            
            ### 🛠️ Arquitetura do Sistema:
            - **Kernel Linux Puro**: Kernel Oficial compilado a partir do código-fonte (kernel.org)
            - **Userland Nativo**: BusyBox estático com utilitários essenciais
            - **Gerenciador de Pacotes Próprio**: `icpkg` nativo em Python
            - **Instalador de Disco**: `inovecloud-install` integrado
            - **Init System**: `/init` nativo do InoveCloud OS
            - **Bootloader**: GRUB 2 híbrido com suporte a UEFI 64-bit e BIOS Legacy
          files: |
            dist-iso/*.iso
            dist-iso/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
