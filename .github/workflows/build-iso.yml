name: Build InoveCloud OS - Pure Kernel & LFS Desktop ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      edition:
        description: 'Selecione a Edição para Compilar'
        required: true
        default: 'pure-kernel-lfs'
        type: choice
        options:
          - 'pure-kernel-lfs'
          - 'micro-core'
      release_tag:
        description: 'Tag de versão para o Release (ex: v2026.1-pure)'
        required: false
        default: 'v2026.1-pure'

permissions:
  contents: write

jobs:
  build-iso:
    name: Compilar InoveCloud OS (${{ github.event.inputs.edition || 'pure-kernel-lfs' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚡ Executar Compilação InoveCloud OS Pure Kernel LFS (~250MB)
        run: |
          chmod +x build-inovecloud.sh icpkg.py inovecloud-install.sh scripts/*.sh 2>/dev/null || true
          sudo ./build-inovecloud.sh

      - name: 🔒 Verificar Integridade da ISO e Checksum SHA256
        run: |
          ls -lh dist-iso/
          cat dist-iso/*.sha256

      - name: 📤 Fazer Upload do Artefato da ISO (.iso & .sha256)
        uses: actions/upload-artifact@v4
        with:
          name: inovecloud-os-pure-kernel-lfs-amd64
          path: |
            dist-iso/*.iso
            dist-iso/*.sha256
          retention-days: 30
          compression-level: 0

      - name: 🏷️ Publicar Release de Alta Velocidade no GitHub (CDN Global)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'latest' }}
          name: "InoveCloud OS 2026 - Pure Kernel LFS (Download Oficial)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 InoveCloud OS 2026 - Pure Linux Kernel LFS (Zero GNOME / Zero Debian)
            
            Sistema Operacional Linux Nativo construído do zero, ultraleve e de alta performance.
            
            ### ⚡ Links Diretos de Download:
            - Baixe a imagem `.iso` abaixo com suporte a UEFI 64-bit e BIOS Legacy.
            
            ### 🛠️ Recursos Incluídos:
            - **Kernel Linux Oficial Puro**: 6.6+ compilado sob medida com DRM/KMS, ALSA e FUSE
            - **Interface Gráfica Nativa LFS**: InoveCloud Liquid Glass Shell (Zero GNOME/Debian)
            - **Init & Core**: BusyBox estático ultraleve com boot em ~2 segundos
            - **App Store & Portabilidade**: Suporte nativo a AppImage, Flatpak e icpkg
            - **Drivers Essenciais**: Aceleração gráfica para Intel, AMD, NVIDIA e VirtualBox
          files: |
            dist-iso/*.iso
            dist-iso/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
