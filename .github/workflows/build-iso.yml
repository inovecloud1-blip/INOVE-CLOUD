name: Build InoveCloud OS - ISO Oficial 2026

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      edition:
        description: 'Selecione a Edição para Compilar'
        required: true
        default: 'real-desktop'
        type: choice
        options:
          - 'real-desktop'
          - 'pure-kernel-lfs'
      compile_kernel:
        description: 'Compilar Kernel Linux do zero (LFS Custom Kernel)?'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag de versão para o Release (ex: v2026.1)'
        required: false
        default: 'v2026.1'

permissions:
  contents: write

jobs:
  build-iso:
    name: Compilar InoveCloud OS 2026 (${{ github.event.inputs.edition || 'real-desktop' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências Node e Gerar Frontend (dist/)
        run: |
          echo "Instalando dependências Node.js e construindo o bundle de produção..."
          npm install --no-audit --no-fund
          npm run build

      - name: 🛠️ Instalar Dependências de Compilação de Kernel e Ferramentas de ISO
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            bc \
            cpio \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            curl \
            wget \
            tar \
            xz-utils \
            python3 \
            busybox-static \
            libncurses-dev

      - name: 🐧 Compilação do Kernel Linux e Geração do Sistema Operacional Real
        run: |
          chmod +x iso-builder/build-iso.sh build-inovecloud.sh scripts/*.sh 2>/dev/null || true
          
          EDITION="${{ github.event.inputs.edition || 'real-desktop' }}"
          COMPILE_KERNEL="${{ github.event.inputs.compile_kernel || 'false' }}"
          
          echo "========================================================================"
          echo " Edição Selecionada: ${EDITION}"
          echo " Compilar Kernel Custom: ${COMPILE_KERNEL}"
          echo "========================================================================"
          
          mkdir -p dist-iso
          
          if [ "${EDITION}" = "pure-kernel-lfs" ] || [ "${COMPILE_KERNEL}" = "true" ]; then
            echo "Iniciando compilação do Kernel Linux puro e montagem do rootfs LFS..."
            sudo ./build-inovecloud.sh
            if [ -f dist-iso/inovecloud-os-pure-flathub-amd64.iso ]; then
              cp dist-iso/inovecloud-os-pure-flathub-amd64.iso dist-iso/inovecloud-os-2026.iso
            fi
          else
            echo "Iniciando compilação do Debian 13 Liquid Glass com GNOME 46 e Suporte Universal..."
            export ISO_NAME="inovecloud-os-2026.iso"
            sudo -E ./iso-builder/build-iso.sh
          fi

      - name: 🔒 Verificar Integridade da ISO e Gerar Checksum SHA256
        run: |
          mkdir -p dist-iso
          cd dist-iso
          
          # Gerar hashes para todas as imagens ISO encontradas
          for iso_file in *.iso; do
            if [ -f "${iso_file}" ]; then
              echo "Gerando SHA256 para ${iso_file}..."
              sha256sum "${iso_file}" > "${iso_file}.sha256"
            fi
          done
          
          echo "--- Conteúdo do Diretório de Saída ---"
          ls -lh
          echo "--- Checksums SHA256 ---"
          cat *.sha256 2>/dev/null || true
          cd ..

      - name: 📤 Fazer Upload do Artefato da ISO (.iso & .sha256)
        uses: actions/upload-artifact@v4
        with:
          name: inovecloud-os-2026-iso
          path: |
            dist-iso/*.iso
            dist-iso/*.sha256
          retention-days: 30
          compression-level: 0

      - name: 🏷️ Publicar Release Oficial no GitHub Releases
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2026.1' }}
          name: "InoveCloud OS 2026 - Imagem ISO Oficial (Download Direto)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 InoveCloud OS 2026 - Imagem ISO Oficial (Sistema Operacional Real)
            
            Sistema Operacional Linux completo, moderno e de alta performance com ambiente **Liquid Glass Desktop**, suporte nativo a UEFI/BIOS, Flatpak, AppImage e aceleração de vídeo para máquinas físicas (Bare-Metal) e Máquinas Virtuais (VirtualBox, VMware, QEMU).
            
            ### 📥 Download da ISO:
            - **`inovecloud-os-2026.iso`**: Imagem instalável e Live Desktop híbrida (UEFI 64-bit + BIOS Legacy).
            - **`inovecloud-os-2026.iso.sha256`**: Assinatura criptográfica de verificação de integridade.
            
            ### 🖥️ Destaques do Sistema Real:
            - **Ambiente Desktop Completo**: Gerenciador de janelas flutuante, Dock Liquid Glass inferior, Nautilus (Arquivos), Terminal GNOME, Configurações do Sistema.
            - **Compatibilidade 100% Anti Tela Preta**: Drivers gráficos universais com suporte integrado a VirtualBox (`vboxvideo`), VMware (`vmwgfx`), Intel, AMD Radeon e NVIDIA.
            - **Loja de Apps & Repositórios**: Suporte integrado a Flathub (Flatpak), AppImage Universal e repositórios oficiais Debian/APT.
            - **InoveCloud Suite Nativo**: Aplicativo nativo em janela redimensionável integrado ao desktop e serviço de infraestrutura local em background.
          files: |
            dist-iso/*.iso
            dist-iso/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
