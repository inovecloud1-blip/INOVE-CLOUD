name: Build InoveCloud OS - ISO Oficial 2026

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      edition:
        description: 'Selecione a Edição para Compilar'
        required: true
        default: 'real-desktop'
        type: choice
        options:
          - 'real-desktop'
          - 'pure-kernel-lfs'
      release_tag:
        description: 'Tag de versão para o Release (ex: v2026.1)'
        required: false
        default: 'v2026.1'

permissions:
  contents: write

jobs:
  build-iso:
    name: Compilar InoveCloud OS 2026 (${{ github.event.inputs.edition || 'real-desktop' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js e Compilar Web Suite
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências e Gerar Frontend (dist/)
        run: |
          npm ci || npm install
          npm run build

      - name: 🛠️ Instalar Dependências de Sistema e Ferramentas de ISO no Runner
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            curl \
            wget \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            bc \
            cpio

      - name: 🚀 Compilar ISO do Sistema Operacional Real (inovecloud-os-2026.iso)
        run: |
          chmod +x iso-builder/build-iso.sh build-inovecloud.sh scripts/*.sh 2>/dev/null || true
          
          EDITION="${{ github.event.inputs.edition || 'real-desktop' }}"
          echo "Compilando edição selecionada: ${EDITION}"
          
          if [ "${EDITION}" = "pure-kernel-lfs" ]; then
            sudo ./build-inovecloud.sh
            mkdir -p dist-iso
            if [ -f dist-iso/inovecloud-os-pure-flathub-amd64.iso ]; then
              cp dist-iso/inovecloud-os-pure-flathub-amd64.iso dist-iso/inovecloud-os-2026.iso
              cd dist-iso && sha256sum inovecloud-os-2026.iso > inovecloud-os-2026.iso.sha256 && cd ..
            fi
          else
            export ISO_NAME="inovecloud-os-2026.iso"
            sudo -E ./iso-builder/build-iso.sh
          fi

      - name: 🔒 Verificar Integridade da ISO e Checksum SHA256
        run: |
          mkdir -p dist-iso
          ls -lh dist-iso/
          if [ -f dist-iso/inovecloud-os-2026.iso.sha256 ]; then
            cat dist-iso/inovecloud-os-2026.iso.sha256
          fi

      - name: 📤 Fazer Upload do Artefato da ISO (.iso & .sha256)
        uses: actions/upload-artifact@v4
        with:
          name: inovecloud-os-2026-iso
          path: |
            dist-iso/*.iso
            dist-iso/*.sha256
          retention-days: 30
          compression-level: 0

      - name: 🏷️ Publicar Release Oficial no GitHub Releases
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2026.1' }}
          name: "InoveCloud OS 2026 - Imagem ISO Oficial (Download Direto)"
          draft: false
          prerelease: false
          body: |
            ## 🚀 InoveCloud OS 2026 - Imagem ISO Oficial (Sistema Operacional Real)
            
            Sistema Operacional Linux completo, moderno e de alta performance com ambiente **Liquid Glass Desktop**, suporte nativo a UEFI/BIOS, Flatpak, AppImage e aceleração de vídeo para máquinas físicas (Bare-Metal) e Máquinas Virtuais (VirtualBox, VMware, QEMU).
            
            ### 📥 Download da ISO:
            - **`inovecloud-os-2026.iso`**: Imagem instalável e Live Desktop híbrida (UEFI 64-bit + BIOS Legacy).
            - **`inovecloud-os-2026.iso.sha256`**: Assinatura criptográfica de verificação de integridade.
            
            ### 🖥️ Destaques do Sistema Real:
            - **Ambiente Desktop Completo**: Gerenciador de janelas flutuante, Dock Liquid Glass inferior, Nautilus (Arquivos), Terminal GNOME, Configurações do Sistema.
            - **Compatibilidade 100% Anti Tela Preta**: Drivers gráficos universais com suporte integrado a VirtualBox (`vboxvideo`), VMware (`vmwgfx`), Intel, AMD Radeon e NVIDIA.
            - **Loja de Apps & Repositórios**: Suporte integrado a Flathub (Flatpak), AppImage Universal e repositórios oficiais Debian/APT.
            - **InoveCloud Suite Nativo**: Aplicativo nativo em janela redimensionável integrado ao desktop e serviço de infraestrutura local em background.
          files: |
            dist-iso/*.iso
            dist-iso/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
