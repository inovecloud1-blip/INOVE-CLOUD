name: Build InoveCloud OS 2026 - Ubuntu 24.04 KDE Plasma 6 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versão para o Release (ex: v2026.1-kde)'
        required: false
        default: 'v2026.1-kde'

permissions:
  contents: write

jobs:
  build-iso:
    name: Compilar Ubuntu 24.04 LTS (Noble) KDE Plasma 6 Live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar Dependências e Compilar
        run: |
          npm install
          npm run build

      - name: 🛠️ Instalar Ferramentas de Criação de ISO (Ubuntu / GRUB / EFI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            curl \
            rsync

      - name: 🚀 Executar Script de Compilação da ISO InoveCloud OS (Ubuntu + KDE Plasma)
        run: |
          chmod +x build-inovecloud.sh
          sudo ./build-inovecloud.sh

      - name: 🔒 Verificar Integridade e Checksum SHA256
        run: |
          ls -lh dist-iso/
          cat dist-iso/*.sha256

      - name: 📤 Fazer Upload do Artefato da ISO (.iso & .sha256)
        uses: actions/upload-artifact@v4
        with:
          name: inovecloud-os-ubuntu24-kde-amd64
          path: |
            dist-iso/*.iso
            dist-iso/*.sha256
          retention-days: 30

      - name: 🏷️ Publicar Release Automático no GitHub
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "InoveCloud OS 2026 - Ubuntu 24.04 LTS + KDE Plasma 6 Edition"
          body: |
            ## 💿 InoveCloud OS - Ubuntu 24.04 LTS (Noble) KDE Plasma 6 Live ISO
            
            Sistema Operacional Linux completo baseado em **Ubuntu 24.04 LTS (Noble Numbat)** com interface desktop **KDE Plasma 6 (Breeze Dark / Liquid Glass)**, Dock flutuante inferior, suporte nativo a Flathub, Snap e pacotes APT.
            
            ### ✨ Destaques:
            - **Base**: Ubuntu 24.04 LTS (Noble Numbat 64-bit)
            - **Ambiente Gráfico**: KDE Plasma 6 com Blur / KWin Glassmorphism nativo
            - **Desempenho**: Menor consumo de RAM (~650 MB em idle) e máxima fluidez
            - **Dock**: Centered Floating Dock com atalhos para Dolphin, Konsole, Firefox, Discover e Configurações
            - **Loja de Aplicativos**: Discover integrado com Flathub, Snap e repositórios Ubuntu
            - **Áudio e Vídeo**: PipeWire de baixa latência + Drivers Mesa 24 / Vulkan
            - **Boot**: Compatível com UEFI e BIOS Legacy
            
            ### 📥 Arquivos:
            - `inovecloud-os-2026.1-ubuntu24-kde-amd64.iso`
            - `inovecloud-os-2026.1-ubuntu24-kde-amd64.iso.sha256`
          files: |
            dist-iso/*.iso
            dist-iso/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
